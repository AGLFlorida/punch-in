name: Tag and Release (Manual)
run-name: "Tag and Release@${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3, no v prefix)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.validate_version.outputs.new_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate version
        id: validate_version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected e.g. 1.2.3 or 1.2.3-b4, no v prefix)"
            exit 1
          fi
          echo "::notice::Releasing version: $VERSION"
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for tag conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.validate_version.outputs.new_version }}"
          if gh release view "$NEW_VERSION" &>/dev/null; then
            echo "::error::Release $NEW_VERSION already exists. Another deployment may be in progress."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.validate_version.outputs.new_version }}"
          IS_PRERELEASE="${{ steps.validate_version.outputs.is_prerelease }}"
          ARGS=(--title "$NEW_VERSION" --target main --generate-notes)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          gh release create "$NEW_VERSION" "${ARGS[@]}"
          echo "::notice::Created release $NEW_VERSION targeting main"
